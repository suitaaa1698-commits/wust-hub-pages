<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>赛事信息 · 武科大资源汇总</title>
<meta name="robots" content="noindex">
<!--
  跳转桩：单项赛事详情页已下线（详情解析内容整体移除），此页只负责把旧链接转走，不再渲染任何赛事内容。
    · ?no=X  → ../calendar/index.html?no=X（竞赛日历对应的赛事深链）
    · 无参数 → ../competitions/index.html（赛事总览）
  meta refresh 是「JS 不可用」时的兜底（统一回总览）；带 no 参数的精确跳转由下面的脚本完成。
-->
<meta http-equiv="refresh" content="0;url=../competitions/index.html">
<!-- 内联 SVG 图标：不引入任何外部资源 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a4fbf'/%3E%3Ctext x='16' y='23' font-size='16' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3E%E8%B5%9B%3C/text%3E%3C/svg%3E">
<style>
  body {
    margin: 0;
    padding: 48px 20px;
    background: #f4f7fb;
    color: #22303f;
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .stub {
    max-width: 560px;
    margin: 0 auto;
    padding: 22px 24px;
    background: #fff;
    border: 1px solid #dbe3ec;
    border-radius: 10px;
  }
  .stub h1 { margin: 0 0 10px; font-size: 19px; color: #033e83; }
  .stub p { margin: 0 0 10px; }
  .stub a { color: #1a4fbf; }
  .stub .note { color: #5b6a7c; font-size: 13.5px; }
</style>
</head>
<body>
<main class="stub">
  <h1>正在跳转…</h1>
  <p>单项赛事详情页已下线：本页不再提供赛事详情内容。</p>
  <p><a id="stubFallback" href="../competitions/index.html">如果没有自动跳转，点这里继续</a>（赛事总览 / 竞赛日历）。</p>
  <p class="note">赛事名称、时间等信息请在「竞赛日历」与「赛事总览」查看；官方通知以主办方原文为准。</p>
</main>

<script>
(function () {
  'use strict';
  var target = '../competitions/index.html';
  try {
    var m = /[?&]no=([^&]*)/.exec(String(location.search || ''));
    if (m && m[1]) {
      target = '../calendar/index.html?no=' + encodeURIComponent(decodeURIComponent(m[1]));
    }
  } catch (e) { /* 非法 query：回总览，不报错 */ }
  var link = document.getElementById('stubFallback');
  if (link) link.setAttribute('href', target);
  location.replace(target);
})();
</script>
</body>
</html>
